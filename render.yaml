services:
  - type: web
    name: staff-dashboard
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: staff-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DIRECTOR_PIN
        value: 2268
      - key: HR_PIN
        value: 5678
      - key: TELEGRAM_BOT_TOKEN
        value: 8753672048:AAGQpilIAcs92TdZBk78vP424Y297XVOjak
      - key: TELEGRAM_CHAT_ID
        value: 1094478911

databases:
  - name: staff-db
    databaseName: staff_dashboard
    plan: free
